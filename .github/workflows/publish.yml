name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish packages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
          scope: "@aliou"
          cache: pnpm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and CLI
        run: pnpm build

      - name: Get release info
        id: release-info
        run: |
          set -euo pipefail
          if ! pnpm changeset status --output=release.json 2>/dev/null; then
            echo '{"releases":[]}' > release.json
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const releases = release.releases?.filter((release) => release.type !== 'none') || [];
          const summary = releases.map((release) => `${release.name}@${release.newVersion}`).join(', ');
          const title = summary ? `Release ${summary}` : 'Release package versions';
          const commit = summary || title;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          NODE
          rm -f release.json

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm publish:packages
          title: ${{ steps.release-info.outputs.title }}
          commit: ${{ steps.release-info.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Get release tag
        id: release-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          version="$(node <<'NODE'
          const packages = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]');
          if (!packages.length) throw new Error('No published packages found');
          console.log(packages[0].version);
          NODE
          )"
          echo "name=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.changesets.outputs.published == 'true'
        env:
          TAG: ${{ steps.release-tag.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally"
          else
            git tag "$TAG" "${{ github.event.workflow_run.head_sha }}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin"
          else
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "$TAG" \
              --notes "Release $TAG"
          fi

      - name: Upload CLI binaries
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" packages/cli/dist/obsdx* --clobber
