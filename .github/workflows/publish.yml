name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish packages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org
          scope: "@aliou"
          cache: pnpm

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm --filter @aliou/obsdx-base-ast --filter @aliou/obsdx-base-engine --filter @aliou/obsdx-index run build

      - name: Get release info
        id: release-info
        run: |
          set -euo pipefail
          if ! pnpm changeset status --output=release.json 2>/dev/null; then
            echo '{"releases":[]}' > release.json
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const releases = release.releases?.filter((release) => release.type !== 'none') || [];
          const summary = releases.map((release) => `${release.name}@${release.newVersion}`).join(', ');
          const title = summary ? `Release ${summary}` : 'Release package versions';
          const commit = summary || title;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          NODE
          rm -f release.json

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm publish:packages
          title: ${{ steps.release-info.outputs.title }}
          commit: ${{ steps.release-info.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
